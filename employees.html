<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MSL CRM Employees</title>
  <style>
    :root{--brand:#1012a8;--brand2:#4f6bff;--bg:#f1f3ff;--radius:12px;--shadow:0 10px 25px rgba(0,0,0,.08);--side:230px}
    *{box-sizing:border-box} body{margin:0;font-family:'Segoe UI',sans-serif;background:var(--bg)}
    .sidebar{position:fixed;left:0;top:0;height:100vh;width:var(--side);background:linear-gradient(180deg,var(--brand),var(--brand2));color:#fff;padding-top:24px}
    .mobile-head{display:none}.menu-btn{border:1px solid rgba(255,255,255,.45);background:transparent;color:#fff;border-radius:8px;padding:6px 10px;font-size:18px}
    .sidebar h2{text-align:center;margin:0 0 24px}.nav-links a{display:block;color:#fff;text-decoration:none;padding:13px 24px;transition:background .2s ease,transform .2s ease}.nav-links a.active,.nav-links a:hover{background:rgba(255,255,255,.15)}
    .main{margin-left:var(--side);padding:22px}.top{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
    .title h2{margin:0;color:var(--brand)} .title p{margin:6px 0 0;color:#6b7280;font-size:13px}
        .cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
    .card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;transition:transform .2s ease, box-shadow .2s ease}.card h3{margin:0 0 8px;color:#334155}.meta{font-size:13px;color:#64748b}
    .card:hover{transform:translateY(-2px);box-shadow:0 14px 26px rgba(15,23,42,.12)}
    .btns{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}.btn{padding:7px 10px;border-radius:8px;text-decoration:none;color:#fff;background:#2563eb;font-size:12px}.btn.green{background:#16a34a}
    @media (max-width:900px){.cards{grid-template-columns:1fr 1fr}}
    @media (max-width:700px){.sidebar{position:static;width:100%;height:auto;padding:8px 10px}.sidebar h2{display:none}.mobile-head{display:flex;align-items:center;justify-content:space-between;padding:2px 2px 8px}.mobile-head .brand{font-size:18px;font-weight:700}.nav-links{display:none;flex-direction:column;gap:6px;background:rgba(255,255,255,.12);border-radius:10px;padding:8px}.sidebar.open .nav-links{display:flex}.nav-links a{padding:10px;border-radius:8px}.main{margin-left:0;padding:12px}.cards{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="mobile-head">
      <div class="brand">MSL CRM</div>
      <button class="menu-btn" type="button" onclick="toggleMenu()">☰</button>
    </div>
    <h2>MSL CRM</h2>
    <nav class="nav-links">
      <a href="dashboard.html">Dashboard</a>
      <a href="schools.html">Schools</a>
      <a class="active" href="employees.html">Employees</a>
      <a href="reminders.html">Reminders</a>
    </nav>
  </aside>

  <main class="main">
    <section class="top">
      <div class="title"><h2>Employees Progress (Admin)</h2><p>Track each employee progress and open filtered schools list</p></div>
      
    </section>
    <section id="cards" class="cards"></section>
  </main>

<script>
const API='https://script.google.com/macros/s/AKfycbxC-Bee0hzkxAdBvgBxniEv7J9R8PvUoA8hWw7sSfu4HNqbNeE2btz3lVH4mMUv_hrv/exec';
const role=(localStorage.getItem('role')||'').toLowerCase();
const cardsEl=document.getElementById('cards');
const sidebarEl=document.querySelector('.sidebar');
if(role!=='admin') window.location='dashboard.html';

const pick=(r,keys)=>{for(const k of keys){if(r[k]!==undefined&&r[k]!==null&&String(r[k]).trim()!=='') return r[k]} return ''};
const d=v=>{const t=String(v||'').trim(); if(!t) return ''; return t.includes('T')?t.split('T')[0]:t};
const n=v=>String(v||'').trim().toLowerCase();

async function load(){
  const res=await fetch(API);
  const data=await res.json();
  const map={};
  const today=new Date().toISOString().split('T')[0];

  data.forEach(r=>{
    const school=pick(r,['school','School Name','School']);
    if(!school) return;

    const emp=pick(r,['Employee Name','employee','employeeName'])||'Unassigned';
    const follow=d(pick(r,['followDate','Follow Up Date','Follow-Up Date']));
    const chance=pick(r,['chance','Conversion Chance']);

    if(!map[emp]) map[emp]={total:0,high:0,today:0,over:0};
    map[emp].total++;
    if(n(chance).includes('high')) map[emp].high++;
    if(follow===today) map[emp].today++;
    if(follow&&follow<today) map[emp].over++;
  });

  cardsEl.innerHTML='';
  Object.keys(map).sort((a,b)=>a.localeCompare(b)).forEach(emp=>{
    const s=map[emp];
    cardsEl.insertAdjacentHTML('beforeend',`<article class="card"><h3>${emp}</h3><div class="meta">Total Visited: <b>${s.total}</b></div><div class="meta">Today Follow-Ups: <b>${s.today}</b></div><div class="meta">High Interest: <b>${s.high}</b></div><div class="meta">Overdue: <b>${s.over}</b></div><div class="btns"><a class="btn" href="schools.html?view=total&employee=${encodeURIComponent(emp)}">Open Schools</a><a class="btn green" href="schools.html?view=overdue&employee=${encodeURIComponent(emp)}">Open Overdue</a></div></article>`);
  });
}

load().catch(()=>{ cardsEl.innerHTML='<article class="card">Unable to load employee progress.</article>'; });
function toggleMenu(){ sidebarEl.classList.toggle('open'); }
document.querySelectorAll('.nav-links a').forEach((link)=>link.addEventListener('click',()=>sidebarEl.classList.remove('open')));
</script>
</body>
</html>
