<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MSL CRM Login</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: 'Segoe UI', sans-serif;
      background: radial-gradient(circle at 20% 20%, #4f6bff, #1012a8 55%, #0b0f74 100%);
      padding: 14px;
    }
    .loginBox {
      width: min(100%, 440px);
      background: rgba(255,255,255,0.98);
      backdrop-filter: blur(8px);
      padding: clamp(22px, 4vw, 40px);
      border-radius: 18px;
      box-shadow: 0 20px 50px rgba(12, 18, 130, 0.35);
      text-align: center;
      transform: translateY(0);
      transition: transform .25s ease, box-shadow .25s ease;
    }
    .loginBox:hover { transform: translateY(-2px); box-shadow: 0 28px 60px rgba(12, 18, 130, 0.38); }
    .logo-wrap { display:flex; justify-content:center; margin-bottom: 10px; }
    .brand-logo { width: min(160px, 38vw); height: auto; filter: drop-shadow(0 8px 14px rgba(16,18,168,.25)); }
    .logo { font-size: clamp(24px, 5vw, 30px); font-weight: 700; color: #1012a8; margin-bottom: 5px; letter-spacing: .5px; }
    .subtitle { font-size: 13px; color: #6b7280; margin-bottom: 22px; }
    input {
      width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 10px; border: 1px solid #d7dcf5;
      font-size: 14px; outline: none; transition: .25s ease;
    }
    input:focus { border-color: #1012a8; box-shadow: 0 0 0 3px rgba(16, 18, 168, 0.14); }
    button {
      width: 100%; padding: 12px; background: linear-gradient(135deg, #1012a8, #4f6bff); border: none; border-radius: 10px;
      color: white; font-size: 15px; cursor: pointer; transition: transform .2s ease, box-shadow .2s ease;
    }
    button:hover { transform: translateY(-1px); box-shadow: 0 10px 18px rgba(16,18,168,0.25); }
    .error { color: #dc2626; margin-top: 10px; font-size: 13px; min-height: 18px; }
    .footer { margin-top: 16px; font-size: 12px; color: #94a3b8; }
  </style>
</head>
<body>
  <div class="loginBox">
    <div class="logo-wrap">
      <img class="brand-logo" src="assets/meridian-logo.svg" alt="Meridian Learning Solutions logo" />
    </div>
    <div class="logo">MSL CRM</div>
    <div class="subtitle">School Sales Management System</div>
    <input id="username" placeholder="Username" />
    <input id="password" type="password" placeholder="Password" />
    <button onclick="login()">Login</button>
    <p id="error" class="error"></p>
    <div class="footer">© 2026 Meridian Learning Solutions</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
